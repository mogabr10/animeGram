name: animegram
description: "A sleek Flutter application for managing and viewing anime content via Telegram."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI & Design
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0
  
  # Network & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Image Caching
  cached_network_image: ^3.3.1
  
  # Backend (Supabase)
  supabase_flutter: ^2.3.0
  
  # Utilities
  url_launcher: ^6.2.4
  shimmer: ^3.0.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
