# Docker Compose configuration for Anime Media Viewer
# Version: 1.0.0
# Usage: docker-compose up -d

version: '3.8'

services:
  # Reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: anime-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anime-backend
    environment:
      - DATABASE_URL=postgresql://anime_user:anime_password@database:5432/anime_db
      - REDIS_URL=redis://cache:6379
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000,http://localhost:3000}
    volumes:
      - ./backend:/app
      - /app/.git  # Exclude git directory
    ports:
      - "8000:8000"
    depends_on:
      - database
      - cache
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anime-frontend
    environment:
      - API_URL=http://backend:8000/api/v1
      - NODE_ENV=production
    ports:
      - "5000:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  database:
    image: postgres:16-alpine
    container_name: anime-database
    environment:
      - POSTGRES_DB=anime_db
      - POSTGRES_USER=anime_user
      - POSTGRES_PASSWORD=anime_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_user -d anime_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis cache
  cache:
    image: redis:7-alpine
    container_name: anime-cache
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cache_password}

  # Adminer for database management (optional)
  adminer:
    image: adminer
    container_name: anime-admin
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

  # Portainer for container management (optional)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: anime-portainer
    command: -p 8000 --restart=always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  portainer_data:
